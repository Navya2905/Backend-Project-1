server {
  listen 80;
  root /usr/share/nginx/html;

  # The browser only ever talks to this server; API calls are forwarded to the backend.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;   # answers can take a while when a real LLM is used
    client_max_body_size 25m;  # a little above the backend's 20 MB upload limit
  }

  # Single-page app: unknown paths load index.html.
  location / {
    try_files $uri /index.html;
  }
}
